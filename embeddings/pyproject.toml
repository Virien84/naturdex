[project]
name = "naturdex-embeddings"
version = "0.1.0"
description = "Scripts de portátil para NaturDex: precalcular embeddings de especies con BioCLIP y exportar el codificador de imagen a ONNX"
readme = "README.md"
authors = [
    { name = "David Anton Alvarez", email = "david.anton.dev@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "open_clip_torch",
    "huggingface_hub",
    "onnx",
    "onnxscript",
    "onnxruntime",
    "pillow",
    "numpy",
    "requests",
    "openpyxl>=3.1.5",
    "pypdf>=6.19.0",
]

[tool.uv]
package = false

# PyTorch solo para CPU: la versión con CUDA pesa ~2,5 GB y no la necesitamos
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
